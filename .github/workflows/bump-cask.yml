name: Bump casks to latest releases

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync casks with latest releases
        run: |
          set -euo pipefail
          bump() {
            local CASK="$1" REPO="$2" DMG="$3"
            local LATEST VER CUR URL SHA
            LATEST=$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" | jq -r .tag_name)
            VER=${LATEST#v}
            CUR=$(grep -oE 'version "[^"]+"' "Casks/${CASK}.rb" | cut -d'"' -f2)
            if [ -z "$VER" ] || [ "$VER" = "null" ] || [ "$VER" = "$CUR" ]; then
              echo "${CASK}: up to date (${CUR})"; return 0
            fi
            URL="https://github.com/${REPO}/releases/download/${LATEST}/${DMG}"
            curl -fsSL -o /tmp/app.dmg "$URL"
            SHA=$(sha256sum /tmp/app.dmg | cut -d' ' -f1)
            sed -i "s/version \"${CUR}\"/version \"${VER}\"/" "Casks/${CASK}.rb"
            sed -i "s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA}\"/" "Casks/${CASK}.rb"
            echo "${CASK}: bumped to ${VER}"
          }
          bump claudeusagebar Artzainnn/ClaudeUsageBar ClaudeUsageBar-Installer.dmg
          bump codexusagebar  Artzainnn/CodexUsageBar  CodexUsageBar-Installer.dmg
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Bump casks to latest releases"
            git push
          fi
